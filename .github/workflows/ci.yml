name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build & test (${{ matrix.package }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - Packages/TFTData
          - Packages/LCUClient
          - Packages/OverlayKit
          - Packages/BoardVision
          - Packages/TFTUI
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.package }}/.build
          key: ${{ runner.os }}-spm-${{ matrix.package }}-${{ hashFiles(format('{0}/Package.resolved', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.package }}-

      - name: swift test
        working-directory: ${{ matrix.package }}
        run: swift test

  app:
    name: Build app shell
    runs-on: macos-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-app-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-app-

      - name: swift build
        run: swift build

  lint:
    name: Lint (SwiftFormat + SwiftLint)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat & SwiftLint
        run: brew install swiftformat swiftlint

      - name: SwiftFormat --lint
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint lint --strict

  comps:
    name: Validate data/comps against comp.schema.json
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jsonschema
        run: pip3 install --quiet jsonschema

      - name: Validate comps
        run: python3 scripts/validate_comps.py
